<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Serpiente - Clásico juego arcade de agilidad y reflejos.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070913'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%2300e676'/%3E%3Ccircle cx='19' cy='13' r='2' fill='%23070913'/%3E%3C/svg%3E">
  <title>Serpiente - Arcade</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="arcade-lock">
  <div id="app-root">
    <!-- Encabezado superior con botón Volver al Menú -->
    <header class="hud-header">
      <div class="brand">
        <a href="../../index.html" class="icon-button back-button" aria-label="Volver al Menú Principal" title="Menú Principal">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </a>
        <span class="brand-badge badge-green">ARCADE</span>
        <h1 class="brand-title brand-green">SERPIENTE</h1>
      </div>
      <div class="hud-actions">
        <button id="btn-sound-toggle" class="icon-button" aria-label="Silenciar / Activar sonido" title="Sonido">
          <svg id="icon-sound-on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
        <button id="btn-pause-header" class="icon-button" aria-label="Pausar juego" title="Pausar (P)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
          </svg>
        </button>
        <button id="btn-restart-header" class="icon-button" aria-label="Reiniciar juego" title="Reiniciar (R)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Área principal del juego -->
    <main class="game-stage">
      <!-- Tablero de juego -->
      <div class="board-wrapper">
        <canvas id="snake-canvas" width="400" height="400" aria-label="Tablero de Serpiente"></canvas>

        <div id="swipe-hint" class="swipe-hint">Desliza o usa los botones para girar</div>

        <!-- Pantalla de Pausa -->
        <div id="overlay-pause" class="game-overlay hidden">
          <div class="overlay-card">
            <h2>EN PAUSA</h2>
            <p>Juego en espera</p>
            <div class="overlay-actions">
              <button id="btn-resume" class="btn-primary">Continuar</button>
              <button id="btn-pause-restart" class="btn-secondary">Reiniciar</button>
              <a href="../../index.html" class="btn-secondary">Menú Principal</a>
            </div>
          </div>
        </div>

        <!-- Pantalla de Game Over -->
        <div id="overlay-gameover" class="game-overlay hidden">
          <div class="overlay-card">
            <h2 class="danger-title">FIN DEL JUEGO</h2>
            <div class="stats-summary">
              <div class="stat-row">
                <span>Puntos</span>
                <strong id="final-score">0</strong>
              </div>
              <div class="stat-row">
                <span>Longitud</span>
                <strong id="final-length">3</strong>
              </div>
              <div class="stat-row highlight">
                <span>Récord</span>
                <strong id="final-highscore">0</strong>
              </div>
            </div>
            <div id="new-record-tag" class="badge-new-record hidden">¡NUEVO RÉCORD!</div>
            <div class="overlay-actions">
              <button id="btn-gameover-restart" class="btn-primary">Jugar de nuevo</button>
              <a href="../../index.html" class="btn-secondary">Menú Principal</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel lateral / HUD de estadísticas -->
      <aside class="side-panel">
        <div class="panel-box stats-grid">
          <div class="stat-item">
            <span class="stat-title">PUNTOS</span>
            <span id="score-display" class="stat-value val-green">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">RÉCORD</span>
            <span id="highscore-display" class="stat-value val-gold">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">LONGITUD</span>
            <span id="length-display" class="stat-value">3</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">VELOCIDAD</span>
            <span id="speed-display" class="stat-value">1</span>
          </div>
        </div>

        <!-- Atajos de teclado (visibles en PC grande) -->
        <div class="panel-box desktop-help">
          <div class="panel-label">CONTROLES</div>
          <ul class="keyboard-legend">
            <li><kbd>▲</kbd><kbd>▼</kbd><kbd>◄</kbd><kbd>►</kbd> Dirección</li>
            <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Mover</li>
            <li><kbd>P</kbd> Pausar</li>
          </ul>
        </div>
      </aside>
    </main>

    <!-- Controles táctiles D-pad para móvil y tablet -->
    <nav class="touch-controls dpad-center" aria-label="Controles táctiles de la serpiente">
      <div class="cross-dpad">
        <button id="ctrl-up" class="touch-btn dpad-btn up" aria-label="Arriba">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/>
          </svg>
        </button>
        <div class="horizontal-btns">
          <button id="ctrl-left" class="touch-btn dpad-btn left" aria-label="Izquierda">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
            </svg>
          </button>
          <div class="dpad-center-pad">
            <span class="dpad-icon-pulse"></span>
          </div>
          <button id="ctrl-right" class="touch-btn dpad-btn right" aria-label="Derecha">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
            </svg>
          </button>
        </div>
        <button id="ctrl-down" class="touch-btn dpad-btn down" aria-label="Abajo">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
          </svg>
        </button>
      </div>
    </nav>
  </div>

  <script src="../../shared/storage.js"></script>
  <script src="../../shared/audio.js"></script>
  <script src="../../shared/canvas.js"></script>
  <script src="game.js"></script>
</body>
</html>
