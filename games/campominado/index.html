<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1c2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Campo Minado - Duelo táctico de detección de minas con casillas en relieve 3D, primer toque seguro y flood-fill iterativo.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1c2e'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ff3366'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ffcc00'/%3E%3C/svg%3E">
  <title>Campo Minado - Arcade 90</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="arcade-lock">
  <div id="app-root">
    <!-- Encabezado superior con botón Volver al Menú -->
    <header class="hud-header">
      <div class="brand">
        <a href="../../index.html" class="icon-button back-button" aria-label="Volver al Menú Principal" title="Menú Principal">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </a>
        <span class="brand-badge badge-90s">ARCADE 90</span>
        <h1 class="brand-title">CAMPO MINADO</h1>
      </div>
      <div class="hud-actions">
        <button id="btn-sound-toggle" class="icon-button" aria-label="Silenciar / Activar sonido" title="Sonido">
          <svg id="icon-sound-on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
        <button id="btn-restart-header" class="icon-button" aria-label="Reiniciar tablero" title="Reiniciar (R)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Selector de Tamaño / Dificultad -->
    <div class="size-bar">
      <button type="button" class="btn-size active" data-size="EASY">9x9 (10)</button>
      <button type="button" class="btn-size" data-size="MEDIUM">12x16 (30)</button>
      <button type="button" class="btn-size" data-size="HARD">16x24 (70)</button>
    </div>

    <!-- Panel de Estado (Minas, Cara de Emoción, Cronómetro) -->
    <div class="status-panel">
      <div class="counter-box">
        <span class="counter-label">MINAS</span>
        <span id="mine-counter" class="counter-val">010</span>
      </div>

      <button id="btn-face" class="face-button" aria-label="Reiniciar juego">
        <span id="face-icon" class="face-emoji">😎</span>
      </button>

      <div class="counter-box">
        <span class="counter-label">TIEMPO</span>
        <span id="time-counter" class="counter-val">000</span>
      </div>
    </div>

    <!-- Escenario de Juego (Canvas con cuadrícula 3D) -->
    <main class="game-stage">
      <div class="board-wrapper" id="board-container">
        <canvas id="mine-canvas" width="480" height="640" aria-label="Cuadrícula de Campo Minado"></canvas>
      </div>
    </main>

    <!-- Barra de Herramientas Táctil Inferior -->
    <footer class="touch-toolbar">
      <button id="btn-mode-toggle" class="mode-toggle-btn active" type="button">
        <span class="toggle-icon">⛏️</span>
        <span class="toggle-text" id="mode-text">MODO: REVELAR</span>
      </button>
      <div class="best-time-tag">
        <span>RÉCORD: <strong id="best-time-val">--</strong>s</span>
      </div>
    </footer>

    <!-- Overlay de Victoria / Derrota -->
    <div id="overlay-result" class="game-overlay hidden">
      <div class="overlay-card">
        <h2 id="result-title">¡VICTORIA!</h2>
        <p id="result-sub">Has despejado todo el sector minado</p>
        <div class="result-stats">
          <div class="stat-item">
            <span class="stat-label">Tiempo</span>
            <span id="stat-final-time" class="stat-num">45s</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Mejor Récord</span>
            <span id="stat-best-time" class="stat-num">38s</span>
          </div>
        </div>
        <div class="overlay-actions">
          <button id="btn-play-again" class="btn-primary">Jugar de Nuevo</button>
          <a href="../../index.html" class="btn-secondary">Menú Principal</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../shared/canvas.js"></script>
  <script src="../../shared/storage.js"></script>
  <script src="../../shared/audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
