<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#031525">
  <title>Lanzaburbujas - Arcade 00s</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- Header estilo Aqua / Aero Glass 2000s -->
    <header id="game-header">
      <a href="../../index.html" class="glass-btn btn-icon" id="btn-back" title="Volver al menú">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>

      <div class="hud-stat hud-score">
        <span class="hud-label">PUNTOS</span>
        <span class="hud-val" id="score-val">0</span>
      </div>

      <div class="hud-stat hud-ceiling">
        <span class="hud-label">TECHO BAJA EN</span>
        <span class="hud-val highlight" id="ceiling-shots-val">5</span>
      </div>

      <div class="header-actions">
        <button id="btn-sound-toggle" class="glass-btn btn-icon" title="Sonido">
          <svg id="icon-sound-on" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg id="icon-sound-off" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
        <button id="btn-pause-header" class="glass-btn btn-icon" title="Pausar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        </button>
      </div>
    </header>

    <!-- Sub-barra de nivel y munición intercambiable -->
    <div id="sub-bar">
      <div class="level-pill">
        <span id="level-title-display">Nivel 1: Despeje Inicial</span>
      </div>

      <div class="ammo-swap-container" id="ammo-swap-wrapper">
        <span class="ammo-label">SIGUIENTE:</span>
        <div class="next-bubble-preview" id="next-bubble-preview">
          <canvas id="next-bubble-canvas" width="32" height="32"></canvas>
        </div>
        <button id="btn-swap-ammo" class="glass-btn swap-btn" title="Intercambiar burbuja">
          ⇄ CAMBIAR
        </button>
      </div>
    </div>

    <!-- Contenedor del Canvas de Juego -->
    <main id="canvas-container">
      <canvas id="game-canvas"></canvas>
    </main>

    <!-- Modal de Inicio y Selector de Niveles -->
    <div id="start-card" class="glass-modal">
      <div class="modal-content glass-panel">
        <div class="bubble-logo-wrapper">
          <div class="bubble-sphere-icon">🫧</div>
        </div>
        <h1 class="glass-title">LANZABURBUJAS</h1>
        <p class="glass-subtitle">Apunta con rebote en las paredes y revienta grupos en la rejilla hexagonal 00s</p>

        <!-- Selector de Niveles (15 niveles) -->
        <div class="levels-header">
          <span>ELIGE NIVEL</span>
        </div>
        <div class="levels-grid-container">
          <div class="levels-grid" id="levels-grid">
            <!-- Rellenado dinámicamente con los 15 niveles -->
          </div>
        </div>

        <button id="btn-endless-mode" class="glass-btn glow-btn btn-large" style="margin-top: 8px;">
          MODO SUPERVIVENCIA (SIN FIN)
        </button>
      </div>
    </div>

    <!-- Modal de Pausa -->
    <div id="overlay-pause" class="glass-modal hidden">
      <div class="modal-content glass-panel">
        <h2 class="glass-title">PAUSA</h2>
        <div class="modal-buttons">
          <button id="btn-resume" class="glass-btn glow-btn btn-large">CONTINUAR</button>
          <button id="btn-restart-level" class="glass-btn btn-large">REINICIAR NIVEL</button>
          <button id="btn-level-select" class="glass-btn btn-large">ELEGIR NIVEL</button>
        </div>
      </div>
    </div>

    <!-- Modal de Fin de Nivel / Game Over -->
    <div id="overlay-result" class="glass-modal hidden">
      <div class="modal-content glass-panel">
        <div id="result-icon" class="result-badge">🎉</div>
        <h2 id="result-title" class="glass-title">¡NIVEL DESPEJADO!</h2>
        <p id="result-subtitle" class="result-subtitle">Has eliminado todas las burbujas.</p>

        <div class="result-stats">
          <div class="stat-row">
            <span>Puntos conseguidos:</span>
            <strong id="result-score-val">0</strong>
          </div>
          <div class="stat-row" id="result-best-row">
            <span>Récord personal:</span>
            <strong id="result-best-val">0</strong>
          </div>
          <div class="stars-row" id="stars-row">
            <span class="star-slot filled">★</span>
            <span class="star-slot filled">★</span>
            <span class="star-slot filled">★</span>
          </div>
        </div>

        <div class="modal-buttons">
          <button id="btn-next-level" class="glass-btn glow-btn btn-large">SIGUIENTE NIVEL</button>
          <button id="btn-retry-level" class="glass-btn btn-large">REINTENTAR</button>
          <button id="btn-exit-to-levels" class="glass-btn btn-large">SELECCIÓN DE NIVELES</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts compartidos del Arcade -->
  <script src="../../shared/canvas.js"></script>
  <script src="../../shared/storage.js"></script>
  <script src="../../shared/audio.js"></script>
  <!-- Lógica y render de Lanzaburbujas -->
  <script src="game.js"></script>
</body>
</html>
