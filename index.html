<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Bloques - Juego de puzzle clásico de bloques que caen, optimizado para móvil y escritorio.">
  <title>Bloques - Juego Clásico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-root">
    <!-- Encabezado superior / Barra de información rápida -->
    <header class="hud-header">
      <div class="brand">
        <span class="brand-badge">ARCADE</span>
        <h1 class="brand-title">BLOQUES</h1>
      </div>
      <div class="hud-actions">
        <button id="btn-pause-header" class="icon-button" aria-label="Pausar juego" title="Pausar (P)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M6 4h4v16H6zm8 0h4v16h-4z"/>
          </svg>
        </button>
        <button id="btn-restart-header" class="icon-button" aria-label="Reiniciar juego" title="Reiniciar (R)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Área principal del juego -->
    <main class="game-stage">
      <!-- Tablero de juego -->
      <div class="board-wrapper">
        <canvas id="board-canvas" width="300" height="600" aria-label="Tablero de juego de Bloques"></canvas>

        <!-- Mensajes en pantalla (efectos de líneas, combo) -->
        <div id="float-banner" class="float-banner" aria-live="polite"></div>

        <!-- Pantalla de Pausa -->
        <div id="overlay-pause" class="game-overlay hidden">
          <div class="overlay-card">
            <h2>EN PAUSA</h2>
            <p>Tómate un respiro</p>
            <div class="overlay-actions">
              <button id="btn-resume" class="btn-primary">Continuar</button>
              <button id="btn-pause-restart" class="btn-secondary">Reiniciar</button>
            </div>
          </div>
        </div>

        <!-- Pantalla de Game Over -->
        <div id="overlay-gameover" class="game-overlay hidden">
          <div class="overlay-card">
            <h2 class="danger-title">FIN DEL JUEGO</h2>
            <div class="stats-summary">
              <div class="stat-row">
                <span>Puntos</span>
                <strong id="final-score">0</strong>
              </div>
              <div class="stat-row">
                <span>Líneas</span>
                <strong id="final-lines">0</strong>
              </div>
              <div class="stat-row">
                <span>Nivel</span>
                <strong id="final-level">1</strong>
              </div>
              <div class="stat-row highlight">
                <span>Récord</span>
                <strong id="final-highscore">0</strong>
              </div>
            </div>
            <div id="new-record-tag" class="badge-new-record hidden">¡NUEVO RÉCORD!</div>
            <div class="overlay-actions">
              <button id="btn-gameover-restart" class="btn-primary">Jugar de nuevo</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel lateral / HUD de estadísticas -->
      <aside class="side-panel">
        <!-- Próxima pieza -->
        <div class="panel-box preview-box">
          <div class="panel-label">SIGUIENTE</div>
          <div class="next-canvas-wrapper">
            <canvas id="next-canvas" width="120" height="120" aria-label="Siguiente bloque"></canvas>
          </div>
        </div>

        <!-- Estadísticas numéricas -->
        <div class="panel-box stats-grid">
          <div class="stat-item">
            <span class="stat-title">PUNTOS</span>
            <span id="score-display" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">NIVEL</span>
            <span id="level-display" class="stat-value">1</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">LÍNEAS</span>
            <span id="lines-display" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-title">RÉCORD</span>
            <span id="highscore-display" class="stat-value">0</span>
          </div>
        </div>

        <!-- Atajos de teclado (visibles en pantallas medianas/grandes) -->
        <div class="panel-box desktop-help">
          <div class="panel-label">CONTROLES</div>
          <ul class="keyboard-legend">
            <li><kbd>←</kbd><kbd>→</kbd> Mover</li>
            <li><kbd>↑</kbd> Rotar</li>
            <li><kbd>↓</kbd> Caída suave</li>
            <li><kbd>Espacio</kbd> Caída rápida</li>
            <li><kbd>P</kbd> Pausar</li>
          </ul>
        </div>
      </aside>
    </main>

    <!-- Controles táctiles optimizados para móvil -->
    <nav class="touch-controls" aria-label="Controles táctiles del juego">
      <!-- Grupo izquierdo: Movimiento y caída suave -->
      <div class="dpad-group">
        <button id="ctrl-left" class="touch-btn move-btn" aria-label="Mover a la izquierda">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
          </svg>
        </button>
        <button id="ctrl-down" class="touch-btn move-btn" aria-label="Caída suave">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
          </svg>
        </button>
        <button id="ctrl-right" class="touch-btn move-btn" aria-label="Mover a la derecha">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
          </svg>
        </button>
      </div>

      <!-- Grupo derecho: Rotación y caída instantánea -->
      <div class="action-group">
        <button id="ctrl-rotate-ccw" class="touch-btn action-btn small-btn" aria-label="Rotar antihorario">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
          </svg>
        </button>
        <button id="ctrl-rotate-cw" class="touch-btn action-btn main-rotate-btn" aria-label="Rotar horario">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.2-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/>
          </svg>
          <span class="btn-subtext">ROTAR</span>
        </button>
        <button id="ctrl-hard-drop" class="touch-btn action-btn hard-drop-btn" aria-label="Caída instantánea">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
            <path d="M7 2v2h10V2H7zm5 6l-5 5h3v7h4v-7h3l-5-5z"/>
          </svg>
          <span class="btn-subtext">CAÍDA</span>
        </button>
      </div>
    </nav>
  </div>

  <script src="game.js"></script>
</body>
</html>
