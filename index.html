<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="SALA ARCADE - Colección de juegos web retro clásicos, sin anuncios ni conexión.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070913'/%3E%3Ccircle cx='11' cy='16' r='4' fill='%2300f0ff'/%3E%3Ccircle cx='21' cy='16' r='4' fill='%2300e676'/%3E%3C/svg%3E">
  <title>Sala Arcade - Juegos Clásicos</title>
  <link rel="stylesheet" href="./shared/theme.css">
  <link rel="stylesheet" href="./menu.css">
</head>
<body>
  <div id="menu-root">
    <!-- Encabezado del Arcade -->
    <header class="menu-header">
      <div class="header-content">
        <div class="hub-brand">
          <span class="hub-tag">RETRO HUB</span>
          <h1 class="hub-title">SALA ARCADE</h1>
        </div>
        <div class="hub-actions">
          <span class="offline-pill">● OFFLINE</span>
        </div>
      </div>
      <p class="hub-subtitle">Selecciona un juego para comenzar o escanea el QR desde tu móvil</p>
    </header>

    <!-- Lista dinámica de tarjetas de juegos -->
    <main class="games-section">
      <div id="games-grid" class="games-grid" aria-label="Catálogo de juegos arcade">
        <!-- Renderizado dinámicamente desde games.json -->
        <div class="loading-state">Cargando juegos...</div>
      </div>
    </main>

    <!-- Pie de página -->
    <footer class="menu-footer">
      <p class="footer-note">Sin frameworks · Sin dependencias · Optimizado para pantalla táctil</p>
    </footer>
  </div>

  <script src="./shared/storage.js"></script>
  <script src="./menu.js"></script>
</body>
</html>
